name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + pytest (offline)
    runs-on: ubuntu-latest
    env:
      # Tests never call a live provider: mock embeddings/LLM, no keys, no Langfuse.
      EMBEDDING_PROVIDER: mock
      LLM_PROVIDER: mock
      GEMINI_LLM_API_KEY: ""
      GEMINI_EMBEDDING_API_KEY: ""
      GEMINI_API_KEY: ""
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check nexus_engine tests
      - name: Test
        run: python -m pytest -p no:cacheprovider

  # Needs network access to vulnerability databases. Recorded in the run summary but does not block merges
  # (continue-on-error): an advisory published tomorrow must not turn yesterday's PR red.
  pip-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pip-audit
      - name: Audit the declared dependencies
        run: python -m pip_audit . --progress-spinner off
