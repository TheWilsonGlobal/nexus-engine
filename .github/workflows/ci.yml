name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (ruff + pytest, offline)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      # Tests never call live external providers: offline mock embeddings/LLM, no network keys.
      EMBEDDING_PROVIDER: mock
      LLM_PROVIDER: mock
      ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install SDK and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,pdf]"
      - name: Lint
        run: python -m ruff check nexus_engine tests
      - name: Test
        run: python -m pytest tests

  pip-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,pdf]"
          python -m pip_audit
